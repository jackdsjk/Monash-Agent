<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="description" content="Cove 匿名信息分诊演示：Gmail、Ed、Moodle 的注意力简报。">
    <title>Cove · 一次巡检</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="rail">
        <div class="brand-block">
          <a class="brand" href="./index.html" aria-label="Cove 演示首页">cove<span>.</span></a>
          <span class="demo-badge">匿名演示 · 预录</span>
        </div>
        <p class="rail-copy">把 Gmail、Ed 和 Moodle 的更新，整理成一份可以核对原文的注意力清单。</p>

        <nav class="primary-nav" aria-label="简报视图">
          <button class="nav-item is-active" data-view="since" aria-current="page">
            <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"></circle><path d="M12 7v5l3 2"></path></svg>
            <span>自上次查看</span>
            <span class="nav-count" id="since-count">14</span>
          </button>
          <button class="nav-item" data-view="all">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"></path></svg>
            <span>全部内容</span>
            <span class="nav-count" id="all-count">55</span>
          </button>
        </nav>

        <div class="rail-panel">
          <p class="eyebrow">今日巡检</p>
          <p class="rail-panel-copy">三个来源，一份清单。先看需要处理的内容，再决定要不要展开低优先级信息。</p>
          <div class="source-list" id="source-counts" role="list" aria-label="来源数量"></div>
          <p class="sync-note"><span class="status-dot"></span>3 个来源已连接 <span>· 演示</span></p>
        </div>

        <div class="rail-bottom">
          <button class="text-button" id="reset" type="button">重置演示</button>
          <p>匿名改写数据<br>预录模型快照 · 2026-10-29</p>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="topbar-copy">
            <p class="eyebrow" id="today-label"></p>
            <h1 id="view-title">自上次查看</h1>
            <p class="subtitle" id="view-subtitle"></p>
          </div>
          <div class="topbar-actions">
            <button class="button button--primary" id="mark-check" type="button">标记本次已查看</button>
            <button class="button button--quiet" id="simulate-sync" type="button">模拟同步</button>
          </div>
        </header>

        <section class="summary" id="summary" aria-label="本次简报统计"></section>

        <div class="toolbar">
          <div class="filter-group" role="group" aria-label="按来源筛选">
            <button class="filter-chip is-active" data-source="all" aria-pressed="true" type="button">全部</button>
            <button class="filter-chip" data-source="gmail" aria-pressed="false" type="button">Gmail</button>
            <button class="filter-chip" data-source="ed" aria-pressed="false" type="button">Ed</button>
            <button class="filter-chip" data-source="moodle" aria-pressed="false" type="button">Moodle</button>
          </div>
          <label class="search-box">
            <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="5.5"></circle><path d="m15 15 4 4"></path></svg>
            <span class="sr-only">搜索内容</span>
            <input id="search" type="search" placeholder="搜索标题、课程或原文" autocomplete="off">
          </label>
          <label class="toggle">
            <input id="only-action" type="checkbox">
            <span class="toggle-track" aria-hidden="true"></span>
            <span>只看需要行动</span>
          </label>
        </div>

        <div class="feed" id="feed" aria-live="polite"></div>

        <footer class="demo-footer">
          <p><strong>演示说明</strong> 所有内容都是匿名改写样本，不连接真实账号，不提供真实原文链接。模型判断来自 2026-10-29 的一次预录回放，不是实时推理。</p>
          <p>快捷键 <kbd>/</kbd> 搜索 · <kbd>Esc</kbd> 关闭详情</p>
        </footer>
      </main>
    </div>

    <dialog class="detail-dialog" id="detail" aria-labelledby="detail-title">
      <div class="detail-shell">
        <header class="detail-head">
          <div>
            <p class="eyebrow" id="detail-kicker"></p>
            <h2 id="detail-title"></h2>
          </div>
          <button class="icon-button" data-action="close-dialog" type="button" aria-label="关闭详情">×</button>
        </header>
        <div class="detail-body" id="detail-body"></div>
      </div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
